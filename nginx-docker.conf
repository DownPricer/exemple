server {
    listen 80;
    server_name localhost;
    # Aligné sur le front (24m) ; uploads démos ZIP plafonnés à 20 Mo côté Express
    client_max_body_size 24m;

    # Let's Encrypt / ACME et autres chemins /.well-known/ — laisser passer
    location ^~ /.well-known/ {
        proxy_pass http://client1-app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers / dossiers cachés (.env, .git, etc.) — 404
    location ~ /\. {
        return 404;
    }

    location / {
        proxy_pass http://client1-app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
