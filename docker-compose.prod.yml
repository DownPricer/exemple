version: "3.8"

services:
  app:
    build: ./le-blanc-express
    container_name: client1-app
    restart: unless-stopped
    env_file:
      - ./le-blanc-express/.env
    networks:
      - downpricer-shared

  web:
    image: nginx:alpine
    container_name: client1-static
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - downpricer-shared

networks:
  downpricer-shared:
    external: true
    name: ${DOWNPRICER_DOCKER_NETWORK}
