version: "3.8"

services:
  web:
    image: nginx:alpine
    container_name: client1-static
    restart: unless-stopped
    volumes:
      - ./le-blanc-express:/usr/share/nginx/html:ro
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - downpricer-shared

networks:
  downpricer-shared:
    external: true
    name: ${DOWNPRICER_DOCKER_NETWORK}
